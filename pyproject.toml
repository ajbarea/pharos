[project]
name = "pharos"
version = "0.1.0"
description = "Labeled fleet testbed for federated personalization with a governed disclosure boundary"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "scikit-learn>=1.6",
    # First-class, not an extra. Traceability is a property of the experiment, not
    # a debugging convenience: a surprising number has to be traceable to the run
    # that produced it. What stays true is that telemetry can never *change* a
    # measurement, so a missing collector degrades to silence rather than to an
    # exception or a different result. That is correctness, not optionality.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
# Retained so `--extra otel` keeps working for anything that already used it.
# The packages are core dependencies now, so this resolves to a no-op.
otel = []

# The adapter experiment. An EXTRA rather than a dependency-group on purpose: CI
# runs `uv sync --all-groups`, which would drag a multi-gigabyte CUDA torch into
# every lint-and-test run for code that only ever executes on a GPU node.
train = [
    "torch>=2.6",
    "peft>=0.14",
    "transformers>=4.48",
    "accelerate>=1.3",
    "datasets>=3.2",
]

[dependency-groups]
# The official MLCommons validator. Kept out of `dev` because it pulls pandas and
# ~24 packages, and the suite must stay fast for the common case; CI runs it as
# its own job so the Croissant record is machine-checked rather than eyeballed.
croissant = [
    "mlcroissant>=1.0",
]
# The explorer web UI. Optional so the core install stays at numpy, scikit-learn,
# and OpenTelemetry; the corpus and the gate never need a web server.
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # FastAPI TestClient backend. starlette deprecates plain httpx in favour of httpx2.
    "httpx2>=0.28",
]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "ruff>=0.15.20",
    "ty>=0.0.44,<0.1",
    "hypothesis>=6.152",
    # Present in dev so the optional telemetry path is genuinely exercised by the
    # suite rather than pragma-excluded from it.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    # The docs site. In `dev` rather than run via `uv tool` because the docs
    # workflow builds with `uv run zensical`, matching the sister repositories, and a
    # tool-run version is not pinned by uv.lock so CI and local could drift.
    "zensical",
    # Dependency vulnerability scan in CI, matching the sisters.
    "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharos"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "W", "C4", "S", "T20",
    "PERF",
    "RUF",
    "PTH",
    "N",
    "PIE",
    "FURB",
    "TCH",
    "FLY",
]
fixable = ["ALL"]
unfixable = ["T20"]
ignore = [
    "E501",   # handled by the formatter
    "SIM108", # ternary rewrites hurt readability in the lattice code
    "RUF001", # ambiguous unicode in strings
    "RUF002", # ambiguous unicode in docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # asserts are the point
"src/pharos/cli.py" = ["T201"] # CLI prints its report
"scripts/*.py" = ["T201"] # measurement scripts report to the terminal
# Reproducible pseudorandomness is these modules' contract: a corpus must be
# regenerable from (seed, config) alone, and a permutation null must be
# reproducible from its seed, which is exactly what a CSPRNG cannot offer.
# Nothing in either module is security-bearing.
"src/pharos/generate.py" = ["S311"]
"src/pharos/gate.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["pharos"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.src]
include = ["src", "tests", "scripts"]

# scripts/ is not a package and is imported by path at runtime, so the type checker
# needs the directory as a module root or every `from measure_... import` is an
# unresolved import. Including it means the measurement code that produces the
# paper's numbers is type-checked like the library, which it was not before.
[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.rules]
all = "warn"
unresolved-import = "error"

# The OpenTelemetry packages live in an optional extra and are deliberately absent
# from the default environment, since Pharos must run offline with no collector.
# Their imports are guarded by try/except ImportError at the only site that uses
# them, so an unresolved import there is the intended state rather than a defect.
[[tool.ty.overrides]]
include = ["src/pharos/telemetry.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

# The adapter experiment's stack (torch, peft, transformers) and the external
# validator's `datasets` live in optional extras and are deliberately absent from the
# default environment. Both scripts import them inside the function that needs them
# and only ever run where the extra is installed, so an unresolved import here is the
# intended state rather than a defect.
[[tool.ty.overrides]]
include = ["scripts/train_adapter.py", "scripts/validate_gate_externally.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.coverage.report]
# What coverage can honestly measure here.
#
# The measurement scripts are orchestration over services the suite must not
# require: Ollama for the measure_* family, a CUDA GPU for the trainer, the HF Hub
# for the external validator. Their `main()` bodies cannot run in CI, and counting
# them would either force the floor down until it stops enforcing anything, or
# invite fake tests that import and monkeypatch a whole pipeline to touch lines.
#
# So the orchestration is excluded and the LOGIC is not. Every pure function those
# scripts rely on -- verdict parsing, example balancing, prompt construction, loss
# masking, the probe's features and statistics -- is covered by tests/test_scripts.py,
# which is where a silent bug would actually live.
exclude_also = [
    "if __name__ == .__main__.:",
    "def main\\(",
    "raise SystemExit",
    "if TYPE_CHECKING:",
    "@overload",
]
