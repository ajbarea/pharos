name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only, never on main.
  #
  # With this set to `true` unconditionally, a rapid series of pushes to main leaves
  # every commit but the last untested: 6 of 15 recent runs were cancelled that way,
  # and one genuine failure went unnoticed because the run that would have shown it
  # green again was itself cancelled. On a protected branch each commit needs its own
  # verdict; on a PR only the tip matters, and cancelling there is what makes fast
  # iteration cheap.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      # Telemetry is a core dependency, so this is not an "is it installed" check.
      # It asserts the correctness property: with the SDK present but no collector
      # configured, configure() reports inactive and the run proceeds unchanged.
      # Telemetry may never alter a measurement, only report one.
      - run: uv run python -c "from pharos import telemetry; assert telemetry.configure() is False"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: >
          uv run pytest --cov=pharos --cov=scripts --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-fail-under=90
          --junitxml=junit.xml -o junit_family=legacy
      # Only one matrix leg uploads. Three identical reports would be merged into the
      # same commit for no added signal and would race each other doing it.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          disable_search: true
      # Dependency vulnerability scan, matching the sisters. Runs last so a CVE in a
      # transitive dependency does not mask a real test failure.
      - name: Audit dependencies
        run: uv run pip-audit

  shortcut-gate:
    # A release condition, and blocking. A corpus whose surface baseline is
    # unmeasured, insignificant against its own null, or above the ceiling cannot
    # support a triage claim, and a fleet trained on one would federate the tell
    # to every deployment.
    #
    # Note what is NOT required: a baseline at chance. Ground truth is defined by
    # the presence of particular content, so plants carry the significant facts
    # more often by construction and shape carries some information necessarily.
    # The requirement is that the baseline be measured, bounded, and published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Gate several seeds
        run: |
          for seed in 1 7 11 23 101 202 303; do
            uv run python -m pharos.cli gate --seed "$seed" --events 400
          done

