name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Group by COMMIT on main and by REF on pull requests, which are different problems.
  #
  # On a protected branch every commit needs its own verdict, and `cancel-in-progress:
  # false` alone does not deliver that. A concurrency group holds at most one running
  # and one pending run, and a newer arrival evicts the pending one unconditionally;
  # the flag governs the running job only. So a shared group plus a rapid series of
  # pushes still drops the middle commits, which is what happened to 7915765 on
  # 2026-08-01 after four pushes in quick succession. Grouping by SHA gives each commit
  # its own group, so nothing queues behind anything and nothing is evicted.
  #
  # This is the second form of the same bug. The first was `cancel-in-progress: true`
  # unconditionally, which cancelled 6 of 15 runs on main and hid a genuine failure
  # because the run that would have shown it fixed was itself cancelled. That fix
  # addressed cancellation of *running* jobs; this one addresses eviction of *queued*
  # ones.
  #
  # Pull requests keep the ref-scoped group and the cancellation, because there only
  # the tip matters and cancelling superseded runs is what makes iteration cheap.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      # Telemetry is a core dependency, so this is not an "is it installed" check.
      # It asserts the correctness property: with the SDK present but no collector
      # configured, configure() reports inactive and the run proceeds unchanged.
      # Telemetry may never alter a measurement, only report one.
      - run: uv run python -c "from pharos import telemetry; assert telemetry.configure() is False"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      # --cov-branch changes what is being measured, not just how it is reported: a
      # partially-taken `if` now counts against the total. The floor tracks that
      # stricter measure. It sat at 88 while scripts/ was largely untested; the
      # remaining gap is load_corpora(), which downloads public datasets and cannot
      # run here. The margin is deliberate -- an earlier floor sat 0.04 points under
      # the measurement and any new line turned the build red.
      - run: >
          uv run pytest --cov=pharos --cov=scripts --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-fail-under=92
          --junitxml=junit.xml -o junit_family=legacy
      # Only one matrix leg uploads. Three identical reports would be merged into the
      # same commit for no added signal and would race each other doing it.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          disable_search: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.13' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          disable_search: true
      # Dependency vulnerability scan, matching the sisters. Runs last so a CVE in a
      # transitive dependency does not mask a real test failure.
      - name: Audit dependencies
        run: uv run pip-audit

  shortcut-gate:
    # A release condition, and blocking. A corpus whose surface baseline is
    # unmeasured, insignificant against its own null, or above the ceiling cannot
    # support a triage claim, and a fleet trained on one would federate the tell
    # to every deployment.
    #
    # Note what is NOT required: a baseline at chance. Ground truth is defined by
    # the presence of particular content, so plants carry the significant facts
    # more often by construction and shape carries some information necessarily.
    # The requirement is that the baseline be measured, bounded, and published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Gate several seeds
        run: |
          for seed in 1 7 11 23 101 202 303; do
            uv run python -m pharos.cli gate --seed "$seed" --events 400
          done
      # The committed triage artifacts have to still describe the corpus this commit
      # generates. This replay refuses to join an artifact whose rows disagree with
      # the regenerated tasks, so it is the drift guard behind every number finding 7
      # publishes. It calls no model and takes seconds; the equivalent check on the
      # Ollama-backed findings is a re-sweep and cannot run here.
      - name: Replay the committed verdicts past the analyst grid
        run: uv run python scripts/measure_analyst_review.py
      # The reviewer sweep is pure computation over the regenerated corpus, so it
      # is a second drift guard: if a corpus change moved the class balance, the
      # majority floor moves with it and finding 8's claim about which cells clear
      # it would silently stop holding.
      - name: Sweep the reviewer grid
        run: uv run python scripts/measure_review_sweep.py
      # The resolvable-effect table depends on the corpus class balance, so a
      # corpus change moves what every published claim can support. Cheap to run,
      # and it is the guard that would notice.
      - name: Price what the evaluation sizes can resolve
        run: uv run python scripts/measure_power.py
      # The linkage attack is a property of the corpus's label structure, so a
      # generator change can move it without touching a line of fleet.py. It calls
      # no model and takes about two seconds, and it is the guard that would notice
      # a corpus edit quietly making the fleet more or less identifiable.
      - name: Measure what the fleet's contribution stream discloses
        run: uv run python scripts/measure_fleet_linkage.py
      # The claim table on the docs site restates results/power.json row for row, and
      # it went stale twice in one day while being maintained by hand. This fails the
      # build when the page and the artifact disagree, and also when it finds no
      # generated blocks at all, since a guard that verifies nothing must not pass.
      # The consensus sweep is pure computation over the regenerated corpus and the
      # analyst policies. If a corpus change moved the class balance, the wrong
      # standard's agreement moves with it and the cliff this finding reports would
      # shift without anyone touching the script.
      - name: Sweep whether reliability survives pooling
        run: uv run python scripts/measure_consensus_reliability.py
      # Tag schemes are a property of the fleet draw and the clearance distribution,
      # so a generator change moves them. No model needed. The edge-cost measurement
      # is deliberately absent: it needs a live model server and a GPU, and a runner
      # without one would report a cold start that is really a connection error.
      - name: Sweep what a reliability tag discloses
        run: uv run python scripts/measure_tagged_aggregation.py
      # The privacy-budget arithmetic depends on the corpus's clearance structure via
      # the widest-separation count, so a generator change moves the composed epsilon.
      - name: Price what a privacy budget buys
        run: uv run python scripts/measure_privacy_budget.py
      # Finding 16's conditional agreements are measured on real fleets through the
      # real pipeline, so a generator change moves them even though the majority
      # probabilities either side of them are exact. It was the one published
      # measurement with no CI step at all.
      - name: Price the cliff when analysts are not drawn independently
        run: uv run python scripts/measure_correlated_fleets.py
      # The difficulty confound depends on the corpus's decoy patterns: change how many
      # carry two of the three signature facts and the control stops being flat. This
      # also exits non-zero if a row the published finding quotes stops converging,
      # which is the live half of that guard -- the other half only sees the committed
      # artifact, and this step runs without `--out`.
      - name: Test whether difficulty and a wrong standard are separable
        run: uv run python scripts/measure_difficulty_confound.py
      # Finding 18's equivalence claim is the one thing here that a refactor of either
      # estimator would break silently: the federated and centralized posteriors have
      # to stay within 1e-6 of each other, and nothing else in the suite compares them
      # on the regenerated corpus. The readership headcounts move with the clearance
      # structure for the same reason the tag sweep above does.
      - name: Check the estimate still matches under secure aggregation
        run: uv run python scripts/measure_secure_reliability.py
      # The anchor thresholds are a property of the corpus and the analyst policies, so
      # a generator change moves the price this finding quotes. Also the live guard on
      # convergence: an anchored EM run that stops converging is a real defect, and it
      # was one -- the movement check compared against a posterior the clamp was about
      # to overwrite, so every anchored run burned the full iteration cap.
      - name: Price the authority of record
        run: uv run python scripts/measure_authority_anchors.py
      # The audit-policy result is a comparison between policies, so it breaks in a way
      # no single-number check would catch: a corpus change that moved which items the
      # fleet splits on would reorder the policies while every individual agreement
      # stayed plausible. This also carries the refuted prediction, and a prediction
      # that quietly stops being refuted is worth hearing about.
      - name: Compare audit-selection policies
        run: uv run python scripts/measure_audit_policy.py
      # Finding 21 is the negative control for finding 20, so it fails in the way that
      # matters most: if a generator change made the blind spot stop corrupting
      # anything, this exits non-zero rather than quietly reporting that a policy works
      # everywhere. It also asserts the blind channel is still orthogonal to difficulty.
      - name: Check the audit policy still fails where it should
        run: uv run python scripts/measure_blind_spot.py
      # Finding 22 is finding 21's answer, and it fails in the way that matters: the
      # script's two negative controls must stay clean. If an unbiased fleet or a
      # fleet with a non-channel-linked threshold error starts scoring a detection,
      # the statistic is reading generic error and the finding is void.
      - name: Detect a blind spot that leaves no disagreement
        run: uv run python scripts/measure_channel_bias.py
      # Fails on a warning the project does not expect, and on an expected warning
      # that stopped firing. The second case is the subtle one: a finding that quietly
      # stops reporting itself looks identical to a clean run.
      - name: Summarise what the measurements logged
        run: uv run python scripts/logcheck.py
      - name: Check the docs tables against their artifacts
        run: uv run python scripts/sync_docs_tables.py --check

