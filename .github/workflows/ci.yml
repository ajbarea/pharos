name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      # Telemetry is a core dependency, so this is not an "is it installed" check.
      # It asserts the correctness property: with the SDK present but no collector
      # configured, configure() reports inactive and the run proceeds unchanged.
      # Telemetry may never alter a measurement, only report one.
      - run: uv run python -c "from pharos import telemetry; assert telemetry.configure() is False"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest --cov=pharos --cov-report=term-missing --cov-fail-under=95

  shortcut-gate:
    # A release condition, and blocking. A corpus whose surface baseline is
    # unmeasured, insignificant against its own null, or above the ceiling cannot
    # support a triage claim, and a fleet trained on one would federate the tell
    # to every deployment.
    #
    # Note what is NOT required: a baseline at chance. Ground truth is defined by
    # the presence of particular content, so plants carry the significant facts
    # more often by construction and shape carries some information necessarily.
    # The requirement is that the baseline be measured, bounded, and published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Gate several seeds
        run: |
          for seed in 1 7 11 23 101 202 303; do
            uv run python -m pharos.cli gate --seed "$seed" --events 400
          done

  docs:
    # The docs site is the living reference, so a build failure is a docs bug that
    # ships silently otherwise. Build only: the repo is private and pre-publication,
    # so nothing is deployed until it goes public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Build the documentation site
        run: uv tool run zensical build --clean
