name: Documentation

# Builds the Zensical site and publishes it to GitHub Pages. Matches the pattern the
# sister repositories use, including the SHA-pinned actions.
#
# The path filter is deliberate: a code change that alters what the docs *describe*
# still has to touch a docs file to say so. The explorer paths below are the exception,
# because `docs/explorer/` is gitignored and built here rather than described here.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      # Explorer build inputs, compiled into the published page.
      - "src/pharos/static/**"
      - "src/pharos/escapes.py"
      - "src/pharos/web.py"
      - "scripts/build_static_explorer.py"
      - "results/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      # The `ui` group is here for the explorer freeze below, which imports the
      # FastAPI app to call its endpoints. Nothing serves it; the app is used as a
      # library so the bundle and the live page cannot answer differently.
      - name: Install Dependencies
        run: uv sync --group dev --group ui --frozen

      # Must precede the Zensical build, which copies docs/explorer verbatim into
      # the site. The directory is gitignored and exists only inside this job.
      - name: Freeze the explorer
        run: uv run python scripts/build_static_explorer.py --out docs/explorer

      - name: Build Documentation
        run: uv run zensical build --clean

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    runs-on: ubuntu-latest
    steps:
      # Twenty minutes, not the default ten: a slow Pages queue outlasts the timer and
      # fails the job for a deployment that then lands anyway.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
        with:
          timeout: 1200000
