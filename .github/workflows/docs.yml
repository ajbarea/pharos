name: Documentation

# Builds the Zensical site and publishes it to GitHub Pages. Matches the pattern the
# sister repositories use, including the SHA-pinned actions.
#
# The path filter is deliberate: a code change that alters what the docs *describe*
# still has to touch a docs file to say so. The explorer paths below are the exception,
# because `docs/explorer/` is gitignored and built here rather than described here.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
      # Explorer build inputs, compiled into the published page.
      - "src/pharos/static/**"
      - "src/pharos/escapes.py"
      - "src/pharos/web.py"
      - "scripts/build_static_explorer.py"
      - "results/**"
  # Build on PRs too, so a dependency bump that breaks the site fails on the PR
  # rather than on the deploy after it merges. Only the publish steps are
  # push-only, so the PR builds exactly what deploys -- explorer freeze included.
  #
  # Deliberately unfiltered, unlike the push trigger: this is a required check,
  # and a required check skipped by a paths filter leaves unrelated PRs waiting
  # on a status that never arrives.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys from main queue behind each other and are never cancelled. A pull request
# gets its own group, so a queue of PR builds cannot cancel a waiting one into a
# "cancelled" required check, and a newer push to the same PR replaces the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      # The `ui` group is here for the explorer freeze below, which imports the
      # FastAPI app to call its endpoints. Nothing serves it; the app is used as a
      # library so the bundle and the live page cannot answer differently. `browser`
      # is for the check that runs the frozen page.
      - name: Install Dependencies
        run: uv sync --group dev --group ui --group browser --frozen

      # Must precede the Zensical build, which copies docs/explorer verbatim into
      # the site. The directory is gitignored and exists only inside this job.
      - name: Freeze the explorer
        run: uv run python scripts/build_static_explorer.py --out docs/explorer

      # The test suite calls the explorer's endpoints from Python and never runs the
      # page, which is how a tab that never opened reached the published site. This
      # runs the copy this job is about to publish, so what passes is what deploys.
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Check the explorer in a browser
        run: uv run pytest -m browser tests/test_explorer_browser.py
        env:
          PHAROS_EXPLORER_DIR: docs/explorer

      - name: Build Documentation
        run: uv run zensical build --clean

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    runs-on: ubuntu-latest
    steps:
      # Ten minutes is the ceiling, not a choice. This asked for twenty, on the reasoning
      # that a slow Pages queue outlasts the timer and fails the job for a deployment that
      # then lands anyway -- and the action clamps to its maximum of 600000ms, which is
      # also its default, so the setting had never done anything and every run said so:
      # "##[warning]Warning: timeout value is greater than the allowed maximum - timeout
      # set to the maximum of 600000 milliseconds." Quoted whole, because a near-miss
      # literal is one nobody can grep an old run for.
      #
      # Kept explicit at the maximum rather than deleted, because the next person to meet
      # a queued deployment will reach for this input, and the ceiling is the answer they
      # need. What that reasoning got wrong twice over: on timeout the action calls
      # setFailed and then cancels the pending deployment, so nothing lands on its own
      # and the workflow has to be re-run.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          timeout: 600000
