# Scrapes the OpenTelemetry Collector's Prometheus exporter, which is where the
# metrics Pharos records over OTLP (gate.*, generate.*) surface.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: pharos-otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
